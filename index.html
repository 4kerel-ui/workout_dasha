<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тренировочный план</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --badge-video: #ef4444;
      --badge-circuit: #f59e0b;
      --badge-weight: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 14px 80px 14px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    header {
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .header-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 4px;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 4px;
    }

    /* Табы переключения тренировок */
    .tabs-wrapper {
      display: flex;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
    }

    /* Блок сета */
    .set-block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .set-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .set-title {
      font-size: 1.05rem;
      font-weight: 500;
      color: #94a3b8;
    }

    .circuit-badge {
      font-size: 0.75rem;
      font-weight: 400;
      background: rgba(245, 158, 11, 0.15);
      color: var(--badge-circuit);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* Элемент упражнения */
    .exercise-item {
      padding: 14px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      background: #0f172a;
      border: 1px solid #1e293b;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .exercise-item:last-child {
      margin-bottom: 0;
    }

    .exercise-item:active {
      transform: scale(0.98);
      border-color: var(--accent);
      background: #131d35;
    }

    .ex-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .ex-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .ex-num {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .ex-name {
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.35;
      color: #ffffff;
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    .video-hint {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .play-icon {
      font-size: 0.65rem;
    }

    .ex-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding-left: 34px;
    }

    .meta-tag {
      font-size: 0.82rem;
      font-weight: 400;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      letter-spacing: 0.01em;
    }

    .tag-video-req {
      font-size: 0.75rem;
      font-weight: 400;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .ex-notes {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 300;
      color: #94a3b8;
      line-height: 1.4;
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid #475569;
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
      margin-left: 34px;
      margin-top: 2px;
    }

    .notes-icon {
      font-size: 0.85rem;
      flex-shrink: 0;
      opacity: 0.8;
    }

    @media (max-width: 380px) {
      .ex-meta, .ex-notes {
        padding-left: 0;
        margin-left: 0;
      }
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .empty-video-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-tag">Индивидуальный план</div>
    <h1 id="page-title">Тренировка 1</h1>
    <p class="subtitle">Нажмите на упражнение, чтобы открыть технику</p>
  </header>

  <!-- Переключатель тренировок -->
  <div class="tabs-wrapper">
    <button class="tab-btn active" onclick="switchWorkout('workout1', this)">Тренировка 1</button>
    <button class="tab-btn" onclick="switchWorkout('workout2', this)">Тренировка 2</button>
  </div>

  <!-- Контейнер для упражнений -->
  <div id="workout-root"></div>
</div>

<!-- Модальное окно YouTube -->
<div id="video-modal" class="modal-overlay" onclick="closeVideo(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Техника выполнения</span>
      <button class="btn-close" onclick="closeVideo()">&times;</button>
    </div>
    <div class="video-container">
      <div id="modal-video-placeholder"></div>
    </div>
  </div>
</div>

<script>
  /* ==============================================================
     БАЗА ДАННЫХ ТРЕНИРОВОК
  ============================================================== */
  const allWorkouts = {
    workout1: {
      title: "Тренировка 1",
      data: [
        {
          setTitle: "Разминочный сет",
          rounds: "2 круга",
          exercises: [
            {
              name: "Жим 1 рукой вверх с кругом локтя",
              scheme: "4 кг • 10-15 раз",
              needVideo: false,
              notes: "",
              videoId: ""
            },
            {
              name: "Тяга 1 рукой в наклоне",
              scheme: [
                "Круг 1: 9 кг × 15",
                "Круг 2: 12 кг × 10"
              ],
              needVideo: true,
              notes: "Сначала пробуешь привычный вес, а второй круг повышаешь. Снять на видео второй круг тяги",
              videoId: ""
            }
          ]
        },
        {
          setTitle: "Второй сет",
          rounds: "2 круга",
          exercises: [
            {
              name: "Подъём ног в висе на двух руках (или с опорой локтями)",
              scheme: "10-15 раз",
              needVideo: false,
              notes: "",
              videoId: ""
            },
            {
              name: "Пуловер",
              scheme: "9 кг • 15-20 раз",
              needVideo: true,
              notes: "Снять технику на видео",
              videoId: ""
            }
          ]
        },
        {
          setTitle: "Третий сет",
          rounds: "2 круга",
          exercises: [
            {
              name: "Зашагивание на возвышенность",
              scheme: "10-12 кг • 12-15 раз",
              needVideo: false,
              notes: "Подконтрольный подъем без отталкивания опорной ногой",
              videoId: ""
            },
            {
              name: "Наклоны в позиции шага на 1 ноге",
              scheme: "10 кг • 10-12 раз",
              needVideo: true,
              notes: "Снять технику на видео, подконтрольный темп",
              videoId: ""
            }
          ]
        },
        {
          setTitle: "Четвёртый сет",
          rounds: "2-3 круга (по самочувствию/времени)",
          exercises: [
            {
              name: "Ягодичный мостик с гантелью",
              scheme: "15 кг • 15-20 раз",
              needVideo: false,
              notes: "Подложить коврик на таз и гантель сверху. Темп очень медленный.",
              videoId: ""
            }
          ]
        }
      ]
    },
    workout2: {
      title: "Тренировка 2",
      data: [
        {
          setTitle: "Разминочный сет",
          rounds: "2 круга",
          exercises: [
            {
              name: "Отведение бедра с опорой на локоть",
              scheme: "5 кг • 15 раз",
              needVideo: false,
              notes: "",
              videoId: ""
            },
            {
              name: "Ягодичные махи в кроссовере",
              scheme: "2.5-5 кг • 15 раз",
              needVideo: true,
              notes: "Движение по диагонали назад. При толчке носочек ноги вращается наружу. Снять технику на видео",
              videoId: ""
            }
          ]
        },
        {
          setTitle: "Второй блок",
          rounds: "2 круга",
          exercises: [
            {
              name: "Приседания со штангой",
              scheme: "15 повторений",
              needVideo: true,
              notes: "Начать с пустого грифа, вес подобрать на 15 повторений. Снять технику на видео",
              videoId: ""
            }
          ]
        },
        {
          setTitle: "Третий блок",
          rounds: "2 круга",
          exercises: [
            {
              name: "Румынская тяга со штангой",
              scheme: "15 повторений",
              needVideo: true,
              notes: "Начать с пустого грифа, вес подобрать на 15 повторений. Снять технику на видео",
              videoId: ""
            }
          ]
        },
        {
          setTitle: "Четвёртый блок",
          rounds: "3 круга",
          exercises: [
            {
              name: "Жим 1 ногой платформы",
              scheme: "20-25 кг • 12 раз",
              needVideo: false,
              notes: "Необходимо занять боковое положение на спинке так, чтобы корпус был неподвижен.",
              videoId: ""
            }
          ]
        }
      ]
    }
  };

  let currentWorkoutKey = "workout1";

  // Переключение активной тренировки
  function switchWorkout(key, btnElement) {
    currentWorkoutKey = key;
    
    // Переключение стилей кнопок
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
    btnElement.classList.add("active");

    // Обновление заголовка
    document.getElementById("page-title").textContent = allWorkouts[key].title;

    // Перерисовка карточек
    renderWorkout();
  }

  // Отрисовка выбранной программы
  function renderWorkout() {
    const root = document.getElementById("workout-root");
    root.innerHTML = "";

    const activeList = allWorkouts[currentWorkoutKey].data;

    activeList.forEach((block, bIdx) => {
      const setCard = document.createElement("div");
      setCard.className = "set-block";

      let exercisesHtml = "";
      block.exercises.forEach((ex, eIdx) => {
        const schemes = Array.isArray(ex.scheme) ? ex.scheme : [ex.scheme];
        const schemeBadges = schemes
          .map(s => `<span class="meta-tag">${s}</span>`)
          .join("");

        exercisesHtml += `
          <div class="exercise-item" onclick="openVideo(${bIdx}, ${eIdx})">
            <div class="ex-top">
              <div class="ex-left">
                <span class="ex-num">${eIdx + 1}</span>
                <span class="ex-name">${ex.name}</span>
              </div>
              <div class="video-hint">
                <span class="play-icon">▶</span>
                <span>Видео</span>
              </div>
            </div>
            <div class="ex-meta">
              ${schemeBadges}
              ${ex.needVideo ? '<span class="tag-video-req">📹 Снять технику</span>' : ''}
            </div>
            ${ex.notes ? `
              <div class="ex-notes">
                <span class="notes-icon">💡</span>
                <span>${ex.notes}</span>
              </div>
            ` : ''}
          </div>
        `;
      });

      setCard.innerHTML = `
        <div class="set-header">
          <span class="set-title">${block.setTitle}</span>
          <span class="circuit-badge">${block.rounds}</span>
        </div>
        ${exercisesHtml}
      `;
      root.appendChild(setCard);
    });
  }

  // Модальное окно
  function openVideo(blockIdx, exIdx) {
    const ex = allWorkouts[currentWorkoutKey].data[blockIdx].exercises[exIdx];
    const modal = document.getElementById("video-modal");
    const title = document.getElementById("modal-title");
    const container = document.getElementById("modal-video-placeholder");

    title.textContent = ex.name;

    if (ex.videoId && ex.videoId.trim() !== "") {
      container.innerHTML = `
        <iframe 
          src="https://www.youtube.com/embed/${ex.videoId.trim()}?autoplay=1&rel=0" 
          allow="autoplay; encrypted-media" 
          allowfullscreen>
        </iframe>
      `;
    } else {
      container.innerHTML = `
        <div class="empty-video-msg">
          Видео для этого упражнения скоро будет загружено тренером
        </div>
      `;
    }

    modal.classList.add("active");
  }

  function closeVideo(event) {
    const modal = document.getElementById("video-modal");
    const container = document.getElementById("modal-video-placeholder");
    container.innerHTML = "";
    modal.classList.remove("active");
  }

  // Старт
  renderWorkout();
</script>
</body>
</html>
